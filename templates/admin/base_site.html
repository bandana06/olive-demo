{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Custom High-End Admin Styles for Olive Cafe */
    :root {
        --primary: #1E3F20;
        --secondary: #2C5E30;
        --accent: #D4AF37;
        --bg-light: #F7F5EB;
    }
    
    body {
        background-color: var(--bg-light);
        font-family: 'Inter', sans-serif;
    }

    #header {
        background-color: var(--primary);
        color: var(--bg-light);
        padding: 15px 20px;
    }

    #branding h1 {
        color: var(--accent);
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-size: 24px;
        margin: 0;
    }

    .module h2, .module caption, .inline-group h2 {
        background: var(--secondary);
        color: white;
    }

    a:link, a:visited {
        color: var(--primary);
    }
    a:hover {
        color: var(--accent);
    }

    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: var(--accent);
        color: var(--primary);
        border: none;
        border-radius: 4px;
        font-weight: bold;
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover, a.button:hover {
        background: #e5c150;
    }

    /* Dashboard Analytics specific */
    .dashboard-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .stat-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border-left: 4px solid var(--accent);
    }
    .stat-card h3 {
        margin: 0 0 10px 0;
        color: #666;
        font-size: 14px;
        text-transform: uppercase;
    }
    .stat-card .value {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary);
    }
</style>
{% endblock %}

{% block content %}
<div id="content-main">
    
    <div class="dashboard-stats">
        <div class="stat-card">
            <h3>Pending Orders</h3>
            <div class="value">
                <!-- Data will be injected via custom AdminSite or template tags later -->
                Needs follow-up
            </div>
        </div>
        <div class="stat-card">
            <h3>Booked Tables</h3>
            <div class="value">
                Manage Availability
            </div>
        </div>
        <div class="stat-card">
            <h3>Today's Analytics</h3>
            <div class="value">
                View Sales
            </div>
        </div>
    </div>

    {{ block.super }}
</div>
{% endblock %}
